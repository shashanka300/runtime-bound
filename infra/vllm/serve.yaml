# vLLM server config, mirroring the evaluation box where it matters for results.
# Eval box: 4x L4, TP=4, gpu_memory_utilization=0.90, max_model_len=32768, LoRA<=8 @ rank<=128.
# Local:    1x RTX 5090 (32 GB), TP=1. Everything else identical unless noted.
# Any key here is a `vllm serve` CLI flag; override per run with CLI args in serve.sh.
host: 127.0.0.1
port: 8000
served-model-name: gemma-4-31b-it
tensor-parallel-size: 1
gpu-memory-utilization: 0.90
max-model-len: 32768
# Cap on concurrently scheduled sequences. The default (256) makes startup profiling
# reserve sampler buffers for 256 x 262k-vocab logits, eating ~2.4 GiB of KV cache on a
# 32 GB card. Only ~1.3 full 32k contexts fit in KV anyway; experiments use <= 8.
max-num-seqs: 16
enable-prefix-caching: true
# Per-request cached-token counts (usage.prompt_tokens_details.cached_tokens): the
# per-call prefix-cache signal for token accounting (E2/H2). Reporting only.
enable-prompt-tokens-details: true
enable-chunked-prefill: true
# Text-only: the SWE tasks never send images/audio. Skips loading and profiling the
# vision tower, which otherwise costs several GiB of VRAM on a 32 GB card.
language-model-only: true
# LoRA OFF by default. The eval box (96 GB) preallocates 8 slots at rank 128; on one 32 GB
# card that alone pushes the model past VRAM (measured: 34.6 GiB at load). Enable only when
# serving adapters (E7), sized to what is actually used, e.g.
#   bash infra/vllm/serve.sh --enable-lora --max-loras 1 --max-lora-rank 16
enable-lora: false
# KV dtype is an experimental factor (recorded in every run manifest). "auto" = model dtype.
kv-cache-dtype: auto
# Needed for the ADK function-calling path used by the harness.
enable-auto-tool-choice: true
tool-call-parser: gemma4
reasoning-parser: gemma4
# Prometheus /metrics is on by default; do not disable (rbcore.hwmon.vllm_metrics scrapes it).
# Per-request logging stays off (vLLM default) to keep logs small.
