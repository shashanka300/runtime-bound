[project]
name = "swebox"
version = "0.1.0"
description = "Local, observable re-implementation of the swegemma two-container SWE evaluation harness"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rbcore",
    "google-adk>=2.9",
    "litellm>=1.77",
    "tokenizers>=0.21",  # force a prebuilt wheel (resolver otherwise backtracks to 0.13 sdist)
    "openinference-instrumentation-google-adk>=0.1.28",
    "networkx>=3.4",
    "numpy>=2.2",
    "orjson>=3.10",
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "docker>=7.2",
    "psutil>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swebox"]
