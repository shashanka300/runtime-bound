[project]
name = "rbcore"
version = "0.1.0"
description = "Shared run context, telemetry, tracing, stats and plotting for the Runtime-Bound experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "structlog>=26.1",
    "numpy>=2.2",
    "scipy>=1.16",
    "polars>=1.44",
    "pyarrow>=21.0",
    "duckdb>=1.5",
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "scienceplots>=2.2",
    "httpx>=0.28",
    "psutil>=7.0",
    "nvidia-ml-py>=13.610",
    "docker>=7.2",
    "prometheus-client>=0.23",
    "codecarbon>=3.3",
    "mlflow-skinny>=3.16",
    "opentelemetry-sdk>=1.39",
    "opentelemetry-exporter-otlp-proto-http>=1.39",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rbcore"]
